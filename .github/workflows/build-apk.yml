name: Build M3CAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout M3CAR source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install M3CAR dependencies
        run: npm install --no-audit --no-fund

      - name: Build M3CAR web assets
        run: npm run build

      - name: Install Capacitor Android
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Create and sync Android application
        run: |
          node -e "require('fs').writeFileSync('capacitor.config.json',JSON.stringify({appId:'com.m3car.app',appName:'M3CAR',webDir:'dist'}))"
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3CAR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

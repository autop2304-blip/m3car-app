name: Build M3CAR APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout M3CAR source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fix Vite 8 and esbuild version conflict
        run: npm pkg set 'devDependencies.esbuild=^0.28.0'

      - name: Install M3CAR dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor Android
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build M3CAR web app
        run: |
          npm run build
          test -f dist/index.html

      - name: Prepare Android app
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.m3car.app', appName:'M3CAR', webDir:'dist'},null,2));"
          if [ ! -f android/gradlew ]; then npx cap add android; fi
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3CAR-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
